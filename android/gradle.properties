# 3 ГБ: dexing AndroidX + material + упаковка .so на 62 МБ идут впритык на 2 ГБ.
# Упаковка буферизует .so ЦЕЛИКОМ в direct-памяти, а по умолчанию
# MaxDirectMemorySize = Xmx, то есть при -Xmx2048m на direct остаётся 2 ГБ —
# этого хватает, но общий пик процесса приближается к 3 ГБ.
# Если Gradle начнёт падать с OutOfMemoryError на :app:packageRelease —
# подними до 4g, это первое, что стоит попробовать.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Повторные сборки заметно быстрее. Если словишь странные ошибки кэша —
# снеси .gradle/ и отключи (configuration-cache=false).
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
