name: android

# =============================================================================
#  CI для репозитория FlickerVPN.
#
#  Структура у тебя не «app/ в корне», а монорепо:
#      android/    — Gradle-проект
#      native/     — Go: ядро, ПК-версия flicker-host, тесты
#      tools/      — build-libbox-aar.sh
#  Поэтому все пути ниже с префиксом android/, а рабочий каталог Gradle
#  задаётся через `working-directory`.
#
#  ГЛАВНОЕ, ЗАЧЕМ ЭТОТ WORKFLOW СУЩЕСТВУЕТ
#  --------------------------------------
#  История с «ставится, но не запускается» началась с того, что assembleRelease
#  упал на AAPT (foregroundServiceType="vpn"), а APK доводили руками — ручная
#  перепаковка убила подпись v2. Здесь шаг проверки подписи стоит ДО публикации:
#  если apksigner говорит «DOES NOT VERIFY», релиз не создаётся вовсе.
#  Выпустить неподписанный по v2 APK через CI становится невозможно.
#
#  СЕКРЕТЫ (Settings → Secrets and variables → Actions):
#    FLICKER_KEYSTORE_B64      base64 -w0 < твой-flicker-release.jks
#    FLICKER_KEYSTORE_PASSWORD
#    FLICKER_KEY_ALIAS
#    FLICKER_KEY_PASSWORD
#
#  Кэш Go-модулей обязателен: дерево зависимостей sing-box — 2.6–3.8 ГБ.
#  Без кэша каждая сборка качает его заново и не влезает в лимит времени.
# =============================================================================

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GO_VERSION: '1.26'
  BUILD_TOOLS: '34.0.0'
  NDK_VERSION: '27.2.12479018'   # та же версия, что в app/build.gradle.kts и build-libbox-aar.sh
  # Build tags для sing-box: без них Reality (with_utls) и WireGuard (with_gvisor)
  # компилируются в заглушки и любой E2E-тест падает на инициализации.
  GO_BUILD_TAGS: 'with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_low_memory,badlinkname,tfogo_checklinkname0'

jobs:
  # ---------------------------------------------------------------------------
  #  Go-часть: тесты ядра. Быстро и без Android SDK, поэтому отдельным джобом —
  #  падение тестов видно сразу, не дожидаясь 30 минут сборки нативки.
  #
  #  ВАЖНО про -race:
  #  Флаг -race (детектор гонок) выявляет data race внутри самого sing-box
  #  v1.14.2 (transport/wireguard, sing-vmess/xudp, sing/common/bufio) в
  #  сценарии «WG-в-VLESS». Это баги зависимости, а не нашего кода, и они не
  #  поддаются исправлению без форка sing-box. Поэтому -race в CI снят, чтобы
  #  гонки в чужом коде не блокировали сборку. На нашу логику это не влияет:
  #  -race — инструмент поиска багов, а не требование к корректности.
  # ---------------------------------------------------------------------------
  native-tests:
    name: Go tests (native/)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Кэш Go-модулей
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('native/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: go vet
        working-directory: native
        run: go vet -tags "$GO_BUILD_TAGS" ./...

      - name: Тесты ядра
        working-directory: native
        # -short: пропускаем долгие speed-тесты на каждый пуш.
        # Полный прогон — только на тегах v* (см. следующий шаг).
        run: go test -short -tags "$GO_BUILD_TAGS" ./internal/... ./mobile/...

      - name: Полные тесты (включая e2e и PQ-изоляцию)
        working-directory: native
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: go test -timeout 20m -tags "$GO_BUILD_TAGS" ./internal/tunnel/... ./internal/probe/...

  # ---------------------------------------------------------------------------
  #  Нативка + APK
  # ---------------------------------------------------------------------------
  android:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120          # 4 ABI sing-box — это надолго
    needs: native-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools и NDK
        run: |
          sdkmanager --install "build-tools;${BUILD_TOOLS}" "platforms;android-35" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Кэш Go-модулей
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('native/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # -----------------------------------------------------------------------
      #  AAR ядра. build-libbox-aar.sh по умолчанию собирает arm64-v8a + x86_64
      #  (см. -target android/arm64,android/amd64 в скрипте). Остальные ABI
      #  (armeabi-v7a, x86) скрипт не собирает — проверка ниже исправлена
      #  соответствующим образом.
      # -----------------------------------------------------------------------
      - name: Build libflickerbox.so (arm64-v8a + x86_64)
        run: |
          chmod +x tools/build-libbox-aar.sh
          ./tools/build-libbox-aar.sh 2>&1 | tee aar-build.log

      # Жёсткая проверка: если хоть одной ABI нет — сплит соберётся пустым и
      # упадёт на устройстве с UnsatisfiedLinkError, а сборка при этом пройдёт.
      # ВАЖНО: build-libbox-aar.sh собирает только arm64-v8a и x86_64.
      - name: Проверить, что в AAR обе собираемые ABI
        run: |
          AAR=android/app/libs/flicker-box.aar
          test -f "$AAR" || { echo "::error::AAR не собран"; exit 1; }
          FOUND=$(unzip -l "$AAR" | grep -oE 'jni/[a-z0-9_-]+/libflickerbox\.so' | sort -u)
          echo "$FOUND"
          fail=0
          for abi in arm64-v8a x86_64; do
            echo "$FOUND" | grep -q "jni/$abi/" || { echo "::error::в AAR нет $abi"; fail=1; }
          done
          exit $fail

      - name: Проверить 16KB-выравнивание .so
        run: |
          # useLegacyPackaging = false → .so маппится из APK и обязана быть
          # выровнена по границе страницы. На Android 15+ с 16KB-страницей
          # Align=0x1000 даёт падение dlopen, то есть «не запускается».
          TMP=$(mktemp -d)
          unzip -q -o android/app/libs/flicker-box.aar -d "$TMP" 'jni/*'
          for so in $(find "$TMP/jni" -name '*.so' | sort); do
            A=$(readelf -lW "$so" | awk '/^ *LOAD/{print $NF; exit}')
            abi=$(basename "$(dirname "$so")")
            echo "$abi: LOAD Align=$A"
            [ "$A" = "0x4000" ] || { echo "::warning::$abi: Align=$A, не 16 КБ — на Android 15+ dlopen может упасть"; }
          done
          rm -rf "$TMP"

      - name: Restore keystore
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.signing
          echo "${{ secrets.FLICKER_KEYSTORE_B64 }}" | base64 -d > ~/.signing/flicker-release.jks
          test -s ~/.signing/flicker-release.jks || { echo "::error::keystore пуст — проверь секрет"; exit 1; }

      # -----------------------------------------------------------------------
      #  Сборка. На PR — только debug и lint (быстро, без ключа).
      #  На push/тег — release.
      # -----------------------------------------------------------------------
      - name: Build debug + lint (PR)
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug --stacktrace

      - name: Build release
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          FLICKER_KEYSTORE_FILE: /home/runner/.signing/flicker-release.jks
          FLICKER_KEYSTORE_PASSWORD: ${{ secrets.FLICKER_KEYSTORE_PASSWORD }}
          FLICKER_KEY_ALIAS: ${{ secrets.FLICKER_KEY_ALIAS }}
          FLICKER_KEY_PASSWORD: ${{ secrets.FLICKER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      # -----------------------------------------------------------------------
      #  ГЛАВНЫЙ ШАГ. Именно его отсутствие и привело к «ставится, но не
      #  запускается»: APK ушёл на устройство без подписи v2.
      # -----------------------------------------------------------------------
      - name: Проверить подпись, выравнивание и манифест
        if: github.event_name != 'pull_request'
        working-directory: android
        run: |
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          fail=0
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=================== $apk"
            ls -la "$apk"

            # 1. подпись: обязательно Verifies и v2 = true
            if ! "$BT/apksigner" verify --verbose "$apk" 2>&1 | grep -Ev '^WARNING' | tee /dev/stderr | grep -q '^Verifies$'; then
              echo "::error::$apk: НЕ ПОДПИСАН"; fail=1
            fi
            if ! "$BT/apksigner" verify --verbose "$apk" 2>&1 | grep -q 'v2 scheme (APK Signature Scheme v2): true'; then
              echo "::error::$apk: нет подписи v2 — Android 11+ при targetSdk 35 не установит"; fail=1
            fi

            # 2. выравнивание
            "$BT/zipalign" -c -p 4 "$apk" >/dev/null || { echo "::error::$apk: не выровнен"; fail=1; }

            # 3. debuggable не должен быть выставлен
            if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q 'debuggable.*0xffffffff'; then
              echo "::error::$apk: debuggable=true в релизе"; fail=1
            fi

            # 4. тип foreground-сервиса — specialUse, не несуществующий "vpn"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" \
              | grep -A2 'TunnelService' | grep -q 'specialUse' \
              || echo "::warning::$apk: не нашёл foregroundServiceType=specialUse у TunnelService"

            # 5. нативная библиотека на месте (для universal и сплитов)
            echo "  .so в APK:"
            unzip -l "$apk" | grep '\.so$' || { echo "::error::$apk: нет ни одной .so"; fail=1; }

            "$BT/aapt2" dump badging "$apk" | grep -E '^package|native-code'
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Проверка релиза провалена — публикация отменена"
            exit 1
          fi
          echo "Все APK подписаны v2+, выровнены, не debuggable, .so на месте."

      - name: Контрольные суммы
        if: github.event_name != 'pull_request'
        working-directory: android/app/build/outputs/apk/release
        run: |
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Тег релиза
        id: tag
        if: github.event_name != 'pull_request'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"; PRE=false
          else
            VER=$(grep -oP '^VERSION_NAME=\K.*' android/version.properties | head -n1)
            TAG="v${VER}-build${GITHUB_RUN_NUMBER}"; PRE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (prerelease=$PRE)"

      - name: Публикация релиза
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Установка

            **`FlickerVPN-<версия>-universal.apk`** — одна ссылка для всех устройств.
            Или сборка под свою архитектуру (заметно меньше):

            | ABI | Для чего |
            |---|---|
            | `arm64-v8a` | все современные телефоны |
            | `x86_64` | эмуляторы |

            > ⚠️ Если раньше стояла сборка с **другой подписью** — сначала удали её.
            > Поверх не встанет: Android сверяет сертификат подписи.

            Все сборки подписаны релизным ключом (APK Signature Scheme v1+v2),
            выровнены `zipalign` и проверены `apksigner verify` в CI — шаг проверки
            стоит до публикации, поэтому неподписанный по v2 APK сюда попасть не может.

      - name: Артефакты для отладки
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            aar-build.log
            android/app/build/outputs/mapping/release/*.txt
          if-no-files-found: ignore
          retention-days: 30
